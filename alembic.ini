[alembic]
script_location = migrations
prepend_sys_path = .
# Development fallback only. Production MUST set FABLE_DATABASE_URL=postgresql+psycopg://...
# migrations/env.py reads FABLE_DATABASE_URL and overrides this value at migration time.
# See RUNBOOK.md for migration instructions.
sqlalchemy.url = sqlite:///./fable.db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
